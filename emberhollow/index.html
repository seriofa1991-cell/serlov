<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Emberhollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Emberhollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d10;--bg2:#1b1612;--card:#241b17;--card2:#2d2119;--line:#5a4030;--line2:#8a6a3a;--gold:#e8c45a;--txt:#eadfca;--mut:#9a8f80;--red:#d63a2a;--grn:#6fe06a;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{position:relative;width:100%;max-width:480px;height:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.hidden{display:none!important}
.pix,.ico,.msp{image-rendering:pixelated}
.ico{width:22px;height:22px;vertical-align:middle;image-rendering:pixelated}
.ico.xs{width:16px;height:16px}.ico.lg{width:34px;height:34px}.ico.xl{width:64px;height:64px}.ico.nav{width:30px;height:30px}.ico.dim{opacity:.35}
.xs.pix{width:16px;height:16px}
h1,h2,.ptitle,.sect{font-family:"Cinzel",Georgia,"Times New Roman",serif;font-variant:small-caps;letter-spacing:.04em}

/* ===== v2 layout ===== */
#stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#arena{position:relative;flex:1;min-height:120px;background:#000;overflow:hidden;cursor:pointer}
#cv,#lab{display:block;position:absolute;left:0;top:0}
#cv{image-rendering:pixelated}
#lab{pointer-events:none}
#hudcard{position:absolute;left:6px;top:calc(6px + var(--sat));display:flex;gap:7px;align-items:center;width:min(236px,58%);padding:6px 8px 6px 6px;background:linear-gradient(#2a1f17ee,#17110fee);border:2px solid var(--line2);border-radius:8px;box-shadow:0 2px 0 #000,inset 0 0 0 1px #00000066;z-index:2;pointer-events:none}
#hport{width:44px;height:44px;border:2px solid var(--line2);background:#2a1f18;border-radius:4px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
#hport img{height:38px}
.hmid{flex:1;min-width:0}
.hpwrap{position:relative;height:14px;background:#3a0f0f;border:2px solid #8a2a1a;border-radius:3px;overflow:hidden}
#hpf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e83a2a,#a01a14);width:100%;transition:width .15s}
#hpt{position:absolute;inset:0;text-align:center;font:700 10px/10px monospace;color:#fff;text-shadow:1px 1px 0 #000}
.hrow{display:flex;justify-content:space-between;gap:6px;font-size:11px;margin-top:2px;align-items:baseline}
#hname2{font-family:"Cinzel",Georgia,serif;font-variant:small-caps;color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hloc{font-size:11px;color:#f0e2c8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hzone{font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;text-align:right}
#hstyle,#hlv{font-size:10px;color:#cdbfa8;white-space:nowrap}
#banner{position:absolute;right:6px;top:calc(6px + var(--sat));display:flex;flex-direction:column;align-items:flex-end;gap:3px;z-index:2;pointer-events:none;max-width:calc(100% - min(236px,58%) - 22px)}
#banner:empty{display:none}
#banner .wave{font-size:11px;padding:4px 6px}
#banner .pips i{width:9px;height:9px}
#banner .small{text-shadow:1px 1px 0 #000;text-align:right}
.wave{font-family:"Press Start 2P",monospace;font-size:13px;color:#fff;background:#3a2b22ee;border:2px solid var(--line2);padding:5px 8px;letter-spacing:1px;text-shadow:2px 2px 0 #000}
.wave.small{font-size:9px}.wave.boss{background:#4a1a5aee;border-color:#c04ae0;color:#f0c8ff}
.bossbar{width:130px;margin:0}.bossbar i{background:linear-gradient(#e070ff,#8a2ab0)}
.pips{display:flex;gap:4px;align-items:center;background:#161010cc;padding:3px 5px;border-radius:4px}
.pips i{width:11px;height:11px;border:2px solid #5a4030;background:#1a120e;border-radius:2px}.pips i.f{background:var(--gold);border-color:#a8842a}
.pips .champ{margin-left:2px}
#track{position:absolute;left:6px;right:6px;bottom:6px;display:flex;flex-direction:column;gap:4px;align-items:center;z-index:2;pointer-events:none}
#track .hint{font-size:11px;color:#f0e2c8;background:#120d0bcc;border-radius:6px;padding:4px 8px;text-align:center;text-shadow:1px 1px 0 #000}
#track .goal{font-size:12px;color:#fff;background:#241b17ee;border:1px solid var(--line2);border-radius:6px;padding:5px 9px;text-align:center}
#mapcard{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:none}
#mapcard .mc{background:linear-gradient(#2a1f17f2,#17110ff2);border:2px solid var(--line2);border-radius:10px;padding:10px;box-shadow:0 3px 0 #000}
#mapcard .mclose{display:block;margin:6px auto 0}
.chip.boss{border-color:#c04ae0;color:#f0c8ff}
.mrow.bossrow{border-color:#7a3a8a;background:#241a2a}
#runbar{display:flex;gap:10px;align-items:center;padding:3px 10px;background:#0e0a09;font:700 11px monospace;color:#d8c8a8;flex-wrap:wrap;border-top:1px solid #000;border-bottom:1px solid #000;min-height:22px}
#runbar .rl{color:var(--mut);letter-spacing:.08em}
#runbar span{display:inline-flex;align-items:center;gap:3px}
#nav{display:flex;background:#0d0908;border-top:2px solid #000;padding-bottom:var(--sab);z-index:5}
.nb{flex:1;background:none;border:0;color:var(--mut);padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10px -apple-system,Arial,sans-serif;cursor:pointer;min-width:0}
.nb.on{color:var(--gold);background:linear-gradient(#2a1f17,#1a120d)}
.nb .ico{filter:saturate(.8)}
#panel{position:absolute;left:0;right:0;top:0;bottom:calc(56px + var(--sab));background:var(--bg2);z-index:4;display:flex;flex-direction:column}

#phead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#17110f;border-bottom:1px solid #000}
.ptitle{font-size:19px;color:var(--gold);display:flex;align-items:center;gap:8px}
.x{width:38px;height:38px;background:#120d0b;border:1px solid var(--line);color:#ccc;border-radius:6px;font-size:20px;cursor:pointer}
#ptabs{display:flex;gap:6px;padding:8px 10px 6px;flex-wrap:wrap;border-bottom:1px solid #2a1e17}
#pbody{flex:1;overflow-y:auto;padding:8px 10px 24px;-webkit-overflow-scrolling:touch}
.pill{display:inline-flex;align-items:center;gap:5px;background:#201813;color:#cdbfa8;border:1px solid #3a2b22;border-radius:999px;padding:7px 12px;font:600 13px -apple-system,Arial,sans-serif;cursor:pointer;white-space:nowrap}
.pill.on{border-color:var(--gold);color:var(--gold);background:#2d2314}
.subpills{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}.subpills.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sect{color:var(--gold);font-size:14px;margin:14px 2px 6px;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;box-shadow:inset 0 0 0 1px #00000066}
.card.sm{padding:8px}.card.ok{border-color:#3f7a3a}
.card p{margin:6px 0}
.rowb{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.small{font-size:12px}.muted{color:var(--mut)}.gold{color:var(--gold)}.bad{color:#ff7a6a}.ok{color:var(--grn)}.warn{color:#e8b84a}.center{text-align:center}.pad{padding:8px 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;background:#1a120e;border:1px solid #3a2b22;border-radius:6px;padding:3px 8px;font-size:12px}.chip.on{border-color:var(--gold);color:var(--gold)}.chip.bad{color:#ff7a6a}
.btn{background:linear-gradient(#5a3d2b,#3a261b);color:#f0e2c8;border:2px solid var(--line2);border-radius:6px;padding:8px 12px;font:700 13px -apple-system,Arial,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff22,0 2px 0 #000}
.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.go{background:linear-gradient(#e8c45a,#b88a2a);color:#2a1a08;border-color:#7a5a1a}
.btn.sm{padding:5px 9px;font-size:12px}.btn.xs{padding:2px 7px;font-size:11px}.btn.on{border-color:var(--gold);color:var(--gold)}.btn.danger{background:linear-gradient(#8a2a1a,#5a1a10);border-color:#c04a3a}.btn.big{width:100%;padding:14px;font-size:16px;margin-top:12px}
.mrow,.rrow,.srow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid #3a2b22;border-radius:8px;padding:8px 10px;margin:5px 0}
.mrow.active{border-color:var(--gold);background:#2a2114}.lock{opacity:.5}
.msp{height:36px;width:auto;max-width:48px;object-fit:contain;background:#1a130e;border-radius:4px;padding:2px}
.rrow{align-items:flex-start}.rcol{display:flex;flex-direction:column;gap:4px;align-items:flex-end;min-width:64px}
.ings{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.ing{font-size:11px;background:#150f0c;border:1px solid #33261d;border-radius:4px;padding:1px 5px;display:inline-flex;align-items:center;gap:3px}.ing.bad{border-color:#7a2a20}
.trait{color:#9ad0ff;font-size:11px}
.bar{height:9px;background:#150f0c;border:1px solid #3a2b22;border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(#e8c45a,#b88a2a)}.bar.gb{width:140px;margin:0}
.stances{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stance{background:var(--card);border:1px solid #3a2b22;border-radius:8px;color:var(--txt);padding:8px 4px;display:flex;flex-direction:column;gap:3px;font-size:12px;cursor:pointer}.stance small{color:var(--mut);font-size:10px}.stance.on{border-color:var(--gold);background:#2d2314;color:var(--gold)}
.eatrow{display:flex;align-items:center;gap:10px;margin:8px 0}.eatrow input{flex:1;accent-color:#e8c45a}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 8px;color:#cdbfa8}.chk input,.srow2 input{width:20px;height:20px;accent-color:#e8c45a}
.srow2{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid #2a1e17;font-size:15px}.srow2:last-child{border:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.tile{position:relative;background:#17110f;border:1px solid #3a2b22;border-radius:6px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.tile.on{border-color:var(--gold)}.tile small{position:absolute;right:3px;bottom:1px;font:700 11px monospace;color:#fff;text-shadow:1px 1px 0 #000}
.gearbox{display:flex;gap:8px;justify-content:center;align-items:center}.gcol{display:flex;flex-direction:column;gap:8px}.gmid{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.herobig{height:150px;image-rendering:pixelated}
.slot{width:62px;height:62px;background:#17110f;border:2px solid #3a2b22;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;padding:0}.slot.has{border-color:var(--line2);background:#2a2014}.slot small{font-size:9px}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stc{background:#17110f;border:1px solid #3a2b22;border-radius:6px;padding:8px 2px;text-align:center;display:flex;flex-direction:column;gap:2px}.stc b{font-size:16px;color:#fff}.stc small{font-size:9px;color:var(--mut)}
.inrow{display:flex;gap:6px;margin:6px 0}
input[type=text],input:not([type]),input[type=search],textarea,.inrow input{flex:1;min-width:0;background:#120d0b;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:10px;font-size:16px}
input.tag{flex:0 0 70px;text-transform:uppercase}
textarea{width:100%;margin-top:8px;font-size:12px}
.jrow{display:flex;justify-content:space-between;gap:8px;padding:8px 2px;border-bottom:1px solid #2a1e17;font-size:13px}
.rk{display:flex;gap:10px;padding:8px 6px;border-bottom:1px solid #2a1e17;font-size:14px;align-items:center}.rk .n{width:24px;color:var(--mut)}.rk.me{background:#2d2314;color:var(--gold);border-radius:6px}
.cmsg{font-size:13px;padding:3px 0}.cmsg.sys{color:#7ab0e8;font-style:italic}.chatbox{height:320px;overflow-y:auto;background:#120d0b;border:1px solid #33261d;border-radius:8px;padding:8px}
.gl{width:58px;text-align:center;border-right:1px solid #3a2b22;padding-right:8px;display:flex;flex-direction:column}.gl b{font-size:20px;color:var(--gold)}.gl small{color:var(--mut);font-size:11px}.grow2{display:flex;gap:10px;align-items:center}
.mapwrap{border:3px solid #5a3a1a;border-radius:8px;overflow:hidden}.mapsvg{display:block;width:100%;height:auto}
.wikig{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wikic{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;cursor:pointer}.wikic b{font-size:14px}.wikic small{color:var(--mut)}.wikic.open{grid-column:1/-1;border-color:var(--gold);text-align:left}.wikic p{margin:4px 0 0;font-size:13px;line-height:1.45}
.fcard.on{background:#2a2114}
/* toasts / modal */
#toasts{position:fixed;top:calc(8px + var(--sat));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:20;pointer-events:none}
.toast{background:#2a1f17ee;border:2px solid var(--line2);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;transition:all .5s;max-width:92%;animation:tin .25s}.toast.gold{border-color:var(--gold);color:var(--gold)}.toast.ok{border-color:#3f9a3a}.toast.bad{border-color:#c04a3a;color:#ff9a8a}.toast.out{opacity:0;transform:translateY(-10px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#modal{position:fixed;inset:0;background:#000000cc;z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.mbox{background:linear-gradient(#2a1f17,#1b1410);border:2px solid var(--line2);border-radius:12px;padding:18px;width:100%;max-width:420px;max-height:100%;overflow-y:auto}
.mbox h1{margin:6px 0 2px;text-align:center;color:var(--gold);letter-spacing:.14em;font-size:26px}.mbox h2{margin:0 0 6px;color:var(--gold)}
.mbox.create{text-align:left}.mbox.create .muted{text-align:center;margin:0 0 10px}.crest{text-align:center}.lbl{display:block;margin:12px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.mbox.create .subpills{justify-content:center}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stylec{background:#17110f;border:2px solid #3a2b22;border-radius:10px;color:var(--txt);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:12px}.stylec small{font-size:10px;color:var(--mut);text-align:center}.stylec.on{border-color:var(--gold);background:#2d2314}


@media (min-width:900px){
  #app{max-width:1500px;flex-direction:row}
  #nav{flex-direction:column;width:78px;border-top:0;border-left:2px solid #000;padding:8px 0;order:3;justify-content:flex-start;gap:4px}
  .nb{flex:none;padding:10px 0 8px;font-size:11px}
  #panel{left:auto;right:78px;width:430px;bottom:0;border-left:2px solid #000;box-shadow:-6px 0 14px #0008}
  #hudcard{width:270px;padding:8px 10px 8px 8px}#hport{width:52px;height:52px}#hport img{height:46px}
  #banner .wave{font-size:14px}
  #mapcard{left:50%;right:auto;width:440px;transform:translateX(-50%)}
}
/* ===== title screen ===== */
#title{position:fixed;inset:0;z-index:40;background:#070b1c;overflow:hidden}
#tcv{position:absolute;left:0;top:0;image-rendering:pixelated}
#tui{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(18px + var(--sat)) 14px calc(14px + var(--sab));overflow-y:auto}
#tlogo{display:block;flex:none;filter:drop-shadow(0 6px 0 #0008)}
#tribbon{position:relative;margin:-6px 0 14px;min-width:230px;text-align:center}
#tribbon span{display:inline-block;background:linear-gradient(#b03a28,#8a2a1c);color:#ffe9c8;font:700 12px "Cinzel",Georgia,serif;letter-spacing:.12em;text-transform:uppercase;padding:6px 26px;border:2px solid #3a0e08;box-shadow:0 3px 0 #000;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 50%,100% 100%,0 100%,10px 50%)}
#tmenu{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin-top:auto;margin-bottom:auto}
.tb{width:100%;padding:14px 12px;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.04em}
.tb small{font-size:11px;opacity:.8;font-weight:600}
.tb.sm2{padding:9px;font-size:13px;background:linear-gradient(#3a2b22,#241b17)}
.tlang{justify-content:center;margin-top:4px}
.tform{background:linear-gradient(#2a1f17ee,#17110fee);border:2px solid var(--line2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 #000}
.tform .lbl{margin:4px 0 0}.tform input{width:100%}
.terr{min-height:18px;color:#ff8a7a;font-size:13px;text-align:center}
.howto{font-size:13px;line-height:1.55;color:#e0d4bc}
#modal{position:fixed;inset:0;z-index:60}
#toasts{position:fixed}
@media (min-width:481px) and (max-width:899px){#app{border-left:2px solid #000;border-right:2px solid #000}}

select{background:#17110f;color:#f0e6d0;border:2px solid var(--line2);border-radius:6px;padding:8px;font:inherit;width:100%;min-width:0}
.inrow input[type=number]{min-width:0;flex:1}

.duel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.dside{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.dsp{height:72px;image-rendering:pixelated}.dsp.flip{transform:scaleX(-1)}.dvs{font:700 16px Cinzel,serif;min-width:64px;text-align:center}.dside .bar{width:100%}

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="arena"><canvas id="cv"></canvas><canvas id="lab"></canvas>
      <div id="hudcard"><div id="hport"></div><div class="hmid"><div class="hpwrap"><div id="hpf"></div><div id="hpt"></div></div>
        <div class="hrow"><span id="hname2"></span><span id="hlv"></span></div>
        <div class="hrow"><span id="hloc"></span><span id="hzone"></span></div><div class="hrow"><span id="hstyle"></span></div></div></div>
      <div id="banner"></div>
      <div id="track"></div>
      <div id="mapcard"></div>
    </div>
    <div id="runbar"></div>
  </div>
  <div id="panel" class="hidden"><div id="phead"></div><div id="ptabs"></div><div id="pbody"></div></div>
  <div id="nav"></div>
  <div id="toasts"></div>
  <div id="modal" class="hidden"></div>
</div>
<div id="title" class="hidden"><canvas id="tcv"></canvas><div id="tui"><canvas id="tlogo"></canvas><div id="tribbon"></div><div id="tmenu"></div></div></div>
<script>
'use strict';
/* ===== i18n: en / lt / ru ===== */
const T = { en: {}, lt: {}, ru: {} };
function D(k, en, lt, ru) { T.en[k] = en; T.lt[k] = lt; T.ru[k] = ru; }

D('wt_start', 'Your hero works on one task at a time and keeps going while you are away (up to 8 hours). Pick Fight or Gather in Adventure. Everything you earn goes to the Bank.', 'Herojus atlieka po vieną užduotį ir tęsia ją, kai tavęs nėra (iki 8 val.). Skiltyje „Nuotykis“ pasirink Kovą arba Rinkimą. Viskas, ką uždirbi, keliauja į banką.', 'Герой выполняет одно задание и продолжает его, пока вас нет (до 8 часов). Выберите Бой или Добычу в «Приключении». Всё добытое попадает в банк.');
D('wt_fight', 'Waves get harder; every 5th wave brings a champion. Beat it to save a checkpoint. Keep food in the bank and set when to eat. If you keep falling, the hero farms easier waves first.', 'Bangos stiprėja; kas 5-a banga turi čempioną. Nugalėk jį ir išsaugosi kontrolinį tašką. Laikyk banke maisto ir nustatyk, kada valgyti. Jei vis žūsti, herojus pirma ūkininkauja lengvesnėse bangose.', 'Волны усложняются; каждая 5-я — с чемпионом. Победите его, чтобы сохранить чекпоинт. Держите еду в банке и настройте, когда есть. Если герой гибнет, он сначала фармит лёгкие волны.');
D('wt_craft', 'Gather ores, logs, fish and plants, then use the Forge, Fletching, Loom, Cookfire and Alchemy. Crafted gear can reveal bonus traits.', 'Rink rūdą, rąstus, žuvį ir augalus, tada naudok Kalvę, Lankų dirbtuvę, Stakles, Laužą ir Alchemiją. Pagaminta ekipuotė gali turėti papildomų savybių.', 'Добывайте руду, брёвна, рыбу и травы, затем используйте Кузницу, Мастерскую, Станок, Костёр и Алхимию. Созданное снаряжение может получить бонусные свойства.');
D('wt_gear', 'Higher tiers need higher skill levels. Bows use arrows; staves and blades need none. Armor absorbs damage. Save outfits as gear sets.', 'Aukštesni lygiai reikalauja aukštesnių įgūdžių. Lankams reikia strėlių; lazdoms ir kardams – ne. Šarvai sugeria žalą. Išsaugok komplektus.', 'Высшие уровни требуют высоких навыков. Луки тратят стрелы; посохи и клинки — нет. Броня поглощает урон. Сохраняйте комплекты.');
D('wt_trade', 'The market opens at total level 20. Sell surplus for coins, buy food and arrows. A guild costs coins but gives bonus XP to everyone.', 'Turgus atsidaro pasiekus bendrą 20 lygį. Parduok perteklių už monetas, pirk maisto ir strėlių. Gildija kainuoja, bet duoda papildomos patirties.', 'Рынок открывается с общего уровня 20. Продавайте лишнее, покупайте еду и стрелы. Гильдия стоит монет, но даёт бонусный опыт.');
D('wt_jobs', 'Townsfolk post repeatable jobs. Chapter quests from the Quartermaster give bigger rewards.', 'Miestelėnai skelbia pasikartojančius darbus. Intendantės skyrių užduotys duoda didesnį atlygį.', 'Горожане дают повторяемые поручения. Главы от Интенданта дают награды побольше.');

function locDist(a, b) { return Math.hypot(LOCS[a].x - LOCS[b].x, LOCS[a].y - LOCS[b].y); }
function routeTo(from, to) { // BFS on road graph
  if (from === to) return [from]; const prev = { [from]: null }, q = [from];
  while (q.length) { const c = q.shift(); for (const n of NEIGH[c]) if (!(n in prev)) { prev[n] = c; if (n === to) { const p = [to]; let k = to; while (prev[k]) { k = prev[k]; p.unshift(k); } return p; } q.push(n); } }
  return [from];
}

    x.fillStyle = 'rgba(0,0,0,.45)'; wb.blocks.forEach(b => x.fillRect(ox + b[0] * s + s * 0.5, oy + b[1] * s + s * 0.6, s, s));

    wb.blocks.forEach(b => { let c = GOLD[b[1]]; const bx = ox + b[0] * s; const dd = Math.abs(bx + b[1] * s * 0.6 - sweep); x.fillStyle = c; x.fillRect(bx, oy + b[1] * s, s, s); if (dd < s * 1.6) { x.fillStyle = 'rgba(255,255,255,.55)'; x.fillRect(bx, oy + b[1] * s, s, s); } });
    x.fillStyle = 'rgba(255,255,255,.35)'; wb.blocks.forEach(b => { if (b[1] === 0) x.fillRect(ox + b[0] * s, oy, s, Math.max(1, s / 4)); });
  });
  // torches
  [[px - 2, h * 0.5], [px + pw - 4, h * 0.5]].forEach((tp, i) => { const fl = Math.floor(t * 10 + i * 3) % 3; x.fillStyle = '#4a3220'; x.fillRect(tp[0], tp[1], 6, 18); x.fillStyle = '#d0501a'; x.fillRect(tp[0] - 1, tp[1] - 8 - fl, 8, 8 + fl); x.fillStyle = '#ff9a1a'; x.fillRect(tp[0] + 1, tp[1] - 11 - fl, 4, 10 + fl); x.fillStyle = '#ffe070'; x.fillRect(tp[0] + 2, tp[1] - 8, 2, 6); x.globalAlpha = 0.18; x.fillStyle = '#ffb030'; x.fillRect(tp[0] - 10, tp[1] - 20, 26, 34); x.globalAlpha = 1; });
}

/* ---- animated title scene ---- */
const TS = { cv: null, x: null, W: 0, H: 0, px: 3, t: 0, stars: [], flies: [], sparks: [] };
function titleResize() {
  const cv = TS.cv; const w = window.innerWidth, h = window.innerHeight; const px = clamp(Math.round(Math.min(w / 110, h / 150)), 2, 6); const W = Math.ceil(w / px), Hh = Math.ceil(h / px);
  if (W === TS.W && Hh === TS.H) return; TS.px = px; TS.W = W; TS.H = Hh; cv.width = W; cv.height = Hh; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const rg = mulberry(42); TS.stars = []; for (let i = 0; i < 70; i++) TS.stars.push([rg() * W, rg() * Hh * 0.55, rg() * 6]); TS.flies = []; for (let i = 0; i < 16; i++) TS.flies.push([rg() * W, Hh * (0.55 + rg() * 0.4), rg() * 6, 0.4 + rg()]);
  TS.mt = []; for (let i = 0; i <= W; i++) TS.mt.push([Math.sin(i * 0.045) * 6 + Math.sin(i * 0.11 + 1) * 3 + Math.sin(i * 0.021 + 2) * 8, Math.sin(i * 0.07 + 3) * 5 + Math.sin(i * 0.15) * 2]);
  TS.houses = [[0.16, 0.70, '#c8b08a', '#8a3a2a'], [0.30, 0.67, '#b89a74', '#3a4a7a'], [0.76, 0.69, '#c8b08a', '#8a3a2a'], [0.88, 0.72, '#b89a74', '#3a4a7a']];
}
function drawTitle(dt) {
  if (!TS.cv || !TS.mt) { titleResize && TS.cv && titleResize(); if (!TS.mt) return; }
  const x = TS.x, W = TS.W, Hh = TS.H, T = TS.t += Math.max(0, +dt || 0); x.imageSmoothingEnabled = false;
  const bands = ['#070b1c', '#0a1030', '#101a42', '#1a2354', '#2a2c64', '#403470', '#5c3c78', '#7e4678', '#a45a72', '#c8706a'];
  const hor = Math.floor(Hh * 0.62); for (let y = 0; y < hor; y++) { x.fillStyle = bands[Math.min(bands.length - 1, Math.floor(y / hor * bands.length))]; x.fillRect(0, y, W, 1); }
  TS.stars.forEach((s, i) => { const a = 0.45 + 0.55 * Math.sin(T * 1.7 + s[2]); x.globalAlpha = Math.max(0, a); x.fillStyle = '#fff'; x.fillRect(Math.round(s[0]), Math.round(s[1]), 1, 1); if (i % 9 === 0) { x.fillRect(Math.round(s[0]) - 1, Math.round(s[1]), 3, 1); x.fillRect(Math.round(s[0]), Math.round(s[1]) - 1, 1, 3); } }); x.globalAlpha = 1;
  // moon
  const mx = Math.round(W * 0.78), my = Math.round(Hh * 0.2); x.globalAlpha = 0.12; disc(x, mx, my, 18, '#fff4c8'); x.globalAlpha = 0.18; disc(x, mx, my, 13, '#fff4c8'); x.globalAlpha = 1; disc(x, mx, my, 9, '#f6edc4'); disc(x, mx - 2, my - 1, 7, '#fffbe0'); x.fillStyle = '#d8cfa0'; x.fillRect(mx + 2, my + 2, 3, 2); x.fillRect(mx - 4, my + 3, 2, 2); x.fillRect(mx + 3, my - 3, 2, 1);
  // clouds
  [[0.2, 0.28, 26], [0.6, 0.38, 34], [0.4, 0.14, 20]].forEach((c, i) => { const cx = ((c[0] * W + T * (2 + i)) % (W + 60)) - 30, cy = Math.round(Hh * c[1]); x.globalAlpha = 0.5; ell(x, cx, cy, c[2], 3, '#2a2a5a'); ell(x, cx + 4, cy - 2, c[2] * 0.6, 2, '#5a4a88'); x.globalAlpha = 1; });
  // mountains
  const drift = Math.floor(T * 0.6); for (let i = 0; i < W; i++) { const m = TS.mt[(((i + drift) % TS.mt.length) + TS.mt.length) % TS.mt.length] || [0, 0]; x.fillStyle = '#1a2040'; x.fillRect(i, hor - 18 - Math.round(m[0]), 1, 30 + Math.round(m[0])); }
  for (let i = 0; i < W; i++) { const m = TS.mt[(((i * 2 + 40) % TS.mt.length) + TS.mt.length) % TS.mt.length] || [0, 0]; x.fillStyle = '#121830'; x.fillRect(i, hor - 8 - Math.round(m[1]), 1, 20 + Math.round(m[1])); }
  // ground
  x.fillStyle = '#0e1a22'; x.fillRect(0, hor, W, Hh - hor); for (let y = hor; y < Hh; y++) { x.fillStyle = y % 3 === 0 ? '#122230' : '#0c1822'; x.fillRect(0, y, W, 1); }
  // village
  TS.houses.forEach((h, i) => { const hx = Math.round(W * h[0]), hy = Math.round(Hh * h[1]); const spr = PROPS.house(h[2], h[3]); x.globalAlpha = 0.9; x.drawImage(spr, hx - 21, hy - 38); x.fillStyle = 'rgba(8,10,40,.62)'; x.globalAlpha = 1; x.fillRect(hx - 21, hy - 38, 42, 38); const fl = 0.7 + 0.3 * Math.sin(T * 5 + i * 2); x.globalAlpha = fl; x.fillStyle = '#ffcc66'; x.fillRect(hx - 13, hy - 15, 6, 6); x.fillRect(hx + 8, hy - 15, 6, 6); x.globalAlpha = 1; if (((T * 3 + i) | 0) % 5 === 0) { x.fillStyle = 'rgba(180,180,200,.5)'; x.fillRect(hx + 8 + Math.sin(T + i) * 2, hy - 44 - ((T * 8 + i * 5) % 14), 3, 3); } });
  // pines (silhouettes)
  [[0.04, 0.78, 1.3], [0.1, 0.84, 1.0], [0.92, 0.8, 1.2], [0.97, 0.86, 1.5], [0.5, 0.64, 0.7], [0.56, 0.63, 0.6]].forEach(p => { const spr = PROPS.pine('#0b2a22', false); const px = Math.round(W * p[0]), py = Math.round(Hh * p[1]); x.save(); x.translate(px, py); x.scale(p[2], p[2]); x.drawImage(spr, -10, -32); x.restore(); });
  // bonfire + hero
  const fx = Math.round(W * 0.5), fy = Math.round(Hh * 0.84); const fl = Math.floor(T * 9) % 3; x.globalAlpha = 0.2 + 0.05 * fl; ell(x, fx, fy - 3, 40, 18, '#ffb030'); x.globalAlpha = 0.16; ell(x, fx, fy - 3, 24, 11, '#ffd070'); x.globalAlpha = 1;
  ell(x, fx, fy + 1, 8, 2, 'rgba(0,0,0,.4)'); x.fillStyle = '#3a2410'; x.fillRect(fx - 7, fy - 1, 14, 3); x.fillRect(fx - 4, fy - 4, 8, 3); x.fillStyle = '#d0501a'; x.fillRect(fx - 4, fy - 8 - fl, 8, 7 + fl); x.fillStyle = '#ff9a1a'; x.fillRect(fx - 3, fy - 11 - fl, 6, 8 + fl); x.fillStyle = '#ffe070'; x.fillRect(fx - 1, fy - 13 - fl, 3, 7 + fl);
  if (Math.random() < 0.5) TS.sparks.push({ x: fx + (Math.random() - 0.5) * 5, y: fy - 10, vx: (Math.random() - 0.5) * 12, vy: -14 - Math.random() * 16, t: 0 });
  for (let i = TS.sparks.length - 1; i >= 0; i--) { const s = TS.sparks[i]; s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; if (s.t > 1.3) { TS.sparks.splice(i, 1); continue; } x.globalAlpha = 1 - s.t / 1.3; x.fillStyle = s.t < 0.6 ? '#ffd070' : '#ff7a1a'; x.fillRect(Math.round(s.x), Math.round(s.y), 1, 1); } x.globalAlpha = 1;
  const hs = heroSpriteF('melee', 0); drawSpr(x, hs, fx - 16, fy + 3 + Math.sin(T * 2) * 0.4, 1, false, 0);
  const ns = npcSprite('alda'); drawSpr(x, ns, fx + 17, fy + 3, 1, true, 0);
  // fireflies
  TS.flies.forEach(f => { const px = f[0] + Math.sin(T * f[3] + f[2]) * 6, py = f[1] + Math.cos(T * f[3] * 1.3 + f[2]) * 4; x.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(T * 2 + f[2])); x.fillStyle = '#d8ff80'; x.fillRect(Math.round(px), Math.round(py), 1, 1); x.globalAlpha = 0.18; x.fillRect(Math.round(px) - 1, Math.round(py) - 1, 3, 3); x.globalAlpha = 1; });
  // vignette
  const g = x.createRadialGradient(W / 2, Hh * 0.55, Math.min(W, Hh) * 0.3, W / 2, Hh * 0.55, Math.max(W, Hh) * 0.8); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)'); x.fillStyle = g; x.fillRect(0, 0, W, Hh);
}

/* ---- title menu UI ---- */
function titleBtn(a, label, cls) { return `<button class="btn tb ${cls || ''}" data-a="${a}">${label}</button>`; }
function langPills() { return `<div class="subpills tlang">${LANGS.map(l => `<button class="pill ${LANG0 === l ? 'on' : ''}" data-a="lang0" data-v="${l}">${LANG_NAMES[l]}</button>`).join('')}</div>`; }
function renderTitleMenu() {
  const m = $('#tmenu'); const sess = sessionUser(); const v = UI.tview || 'main'; let o = '';
  $('#tribbon').innerHTML = `<span>${tr('tagline')}</span>`;
  if (v === 'main') {
    if (sess) o += titleBtn('m_continue', `▶ ${tr('m_continue')}<small>${esc(sess.name)}</small>`, 'go');
    o += titleBtn('m_login', tr('m_login'), sess ? '' : 'go') + titleBtn('m_register', tr('m_register')) + titleBtn('m_howto', tr('m_howto'), 'sm2') + langPills();
  } else if (v === 'login' || v === 'reg') {
    const reg = v === 'reg';
    o += `<div class="tform"><label class="lbl">${tr('username')}</label><input id="t_user" maxlength="16" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(UI.tuser || '')}"><label class="lbl">${tr('password')}</label><input id="t_pw" type="password" maxlength="40" autocomplete="${reg ? 'new-password' : 'current-password'}">${reg ? `<label class="lbl">${tr('password2')}</label><input id="t_pw2" type="password" maxlength="40" autocomplete="new-password">` : ''}<div class="terr" id="t_err">${UI.terr ? tr(UI.terr) : ''}</div>${titleBtn(reg ? 'm_doreg' : 'm_dologin', reg ? tr('do_register') : tr('do_login'), 'go')}${titleBtn('m_back', tr('back'), 'sm2')}<div class="small muted center">${tr('local_note')}</div></div>`;
  } else if (v === 'how') {
    o += `<div class="tform"><h2>${tr('howto_title')}</h2><div class="howto">${tr('howto_text')}</div>${titleBtn('m_back', tr('back'), 'go')}</div>`;
  }
  m.innerHTML = o;
}
function showTitle() {
  UI.inTitle = true; UI.tview = 'main'; UI.terr = ''; $('#title').classList.remove('hidden'); if (!TS.cv) { TS.cv = $('#tcv'); TS.x = TS.cv.getContext('2d'); } TS.W = 0; titleResize(); sizeLogo(); renderTitleMenu();
}
function setTerr(t) { const e = $('#t_err'); if (e) e.textContent = t; }
function tUserPw() { const u = ($('#t_user') || {}).value || '', p = ($('#t_pw') || {}).value || '', p2 = ($('#t_pw2') || {}).value || ''; UI.tuser = u; return [u, p, p2]; }
Object.assign(ACT, {
  lang0(v) { setLang0(v); renderTitleMenu(); },
  async m_continue() { const s = sessionUser(); if (!s) return; setTerr('...'); try { const r = await NET.rpc('eh_resume', { p_token: s.token }); if (r.err) { netStore(null); UI.tview = 'login'; UI.terr = 'err_bad'; renderTitleMenu(); return; } enterAccount(userKey(r.name), false, r.save, s.token, r.name); } catch (e) { setTerr(tr('err_net')); } },
  m_login() { UI.tview = 'login'; UI.terr = ''; renderTitleMenu(); }, m_register() { UI.tview = 'reg'; UI.terr = ''; renderTitleMenu(); }, m_howto() { UI.tview = 'how'; renderTitleMenu(); }, m_back() { UI.tview = 'main'; UI.terr = ''; renderTitleMenu(); },
  async m_dologin() { const [u, p] = tUserPw(); setTerr('...'); const r = await netAuth('login', u, p); if (r.err) { setTerr(tr(r.err)); return; } enterAccount(userKey(r.name), false, r.save, r.token, r.name); },
  async m_doreg() { const [u, p, p2] = tUserPw(); if (p !== p2) { setTerr(tr('err_pw2')); return; } setTerr('...'); const r = await netAuth('reg', u, p); if (r.err) { setTerr(tr(r.err)); return; } enterAccount(userKey(r.name), true, null, r.token, r.name); },
  logout() { logout(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && UI.inTitle && (e.target.id === 't_user' || e.target.id === 't_pw' || e.target.id === 't_pw2')) { (UI.tview === 'reg' ? ACT.m_doreg : ACT.m_dologin)(); } });
window.addEventListener('resize', () => { if (UI.inTitle && TS.cv) { titleResize(); sizeLogo(); } });


</script>
